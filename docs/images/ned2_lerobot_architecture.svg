<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">NED2 LeRobot ROS 2 Architecture</title>
  <desc id="desc">Diagram showing leader NED2 ROS 2 topics flowing into the LeRobot teleoperator, LeRobot sending actions to the follower robot plugin, and the follower plugin commanding the follower NED2 controller, gripper services, and cameras.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L11,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L11,6 L2,10 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L11,6 L2,10 Z" fill="#ea580c"/>
    </marker>
    <style>
      .title { font: 700 28px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 14px Inter, Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 18px Inter, Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 500 13px Inter, Arial, sans-serif; fill: #334155; }
      .small { font: 600 12px Inter, Arial, sans-serif; fill: #475569; }
      .label { font: 700 12px Inter, Arial, sans-serif; fill: #ffffff; }
      .chip { font: 700 11px Inter, Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1100" height="560" rx="28" fill="url(#bg)"/>
  <text x="54" y="58" class="title">NED2 LeRobot ROS 2 Integration</text>
  <text x="54" y="84" class="subtitle">Leader joint states become LeRobot actions; follower actions become ROS 2 trajectory and gripper commands.</text>

  <g filter="url(#shadow)">
    <rect x="54" y="132" width="244" height="164" rx="20" fill="#ffffff"/>
    <rect x="54" y="132" width="244" height="42" rx="20" fill="url(#blue)"/>
    <text x="78" y="158" class="label">Leader NED2</text>
    <text x="78" y="204" class="box-title">ROS 2 namespace</text>
    <text x="78" y="230" class="box-text">/leader/joint_states</text>
    <text x="78" y="252" class="box-text">/leader/.../custom_button_status</text>
    <text x="78" y="274" class="small">Physical arm used as input</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="424" y="114" width="252" height="200" rx="20" fill="#ffffff"/>
    <rect x="424" y="114" width="252" height="42" rx="20" fill="url(#green)"/>
    <text x="448" y="140" class="label">LeRobot Process</text>
    <text x="448" y="188" class="box-title">ned2_ros2_leader</text>
    <text x="448" y="214" class="box-text">Teleoperator reads JointState</text>
    <text x="448" y="236" class="box-text">Button toggles gripper</text>
    <rect x="448" y="258" width="204" height="34" rx="17" fill="#ecfdf5" stroke="#86efac"/>
    <text x="468" y="280" class="small">Action dict: joint_*.pos, gripper</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="802" y="132" width="244" height="164" rx="20" fill="#ffffff"/>
    <rect x="802" y="132" width="244" height="42" rx="20" fill="url(#orange)"/>
    <text x="826" y="158" class="label">Follower NED2</text>
    <text x="826" y="204" class="box-title">ROS 2 namespace</text>
    <text x="826" y="230" class="box-text">/follower/joint_states</text>
    <text x="826" y="252" class="box-text">/follower/.../follow_joint_trajectory</text>
    <text x="826" y="274" class="small">Physical arm executing actions</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="424" y="366" width="252" height="126" rx="20" fill="#ffffff"/>
    <rect x="424" y="366" width="252" height="42" rx="20" fill="url(#green)"/>
    <text x="448" y="392" class="label">ned2_ros2_follower</text>
    <text x="448" y="436" class="box-text">Sends FollowJointTrajectory goals</text>
    <text x="448" y="458" class="box-text">Calls open/close gripper services</text>
    <text x="448" y="480" class="box-text">Reads front_cam and hand_cam</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="802" y="374" width="244" height="108" rx="20" fill="#ffffff"/>
    <rect x="802" y="374" width="244" height="42" rx="20" fill="#64748b"/>
    <text x="826" y="400" class="label">Observations</text>
    <text x="826" y="444" class="box-text">Joint feedback + gripper state</text>
    <text x="826" y="466" class="box-text">front_cam + hand_cam frames</text>
  </g>

  <path d="M298 214 C344 214 374 214 424 214" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="318" y="200" class="small">JointState + button</text>

  <path d="M676 214 C722 214 752 214 802 214" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="700" y="200" class="small">LeRobot action</text>

  <path d="M802 264 C730 326 728 408 676 430" fill="none" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <text x="704" y="350" class="small">Controller + service calls</text>

  <path d="M676 430 C724 430 752 430 802 430" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="700" y="418" class="small">Recorded observations</text>

  <g>
    <rect x="54" y="402" width="244" height="58" rx="16" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="78" y="426" class="box-text">Install once: python -m pip install -e .</text>
    <text x="78" y="448" class="small">Registers both LeRobot plugin types</text>
  </g>
</svg>
