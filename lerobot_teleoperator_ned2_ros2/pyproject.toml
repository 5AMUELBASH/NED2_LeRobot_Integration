[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_teleoperator_ned2_ros2"
version = "0.1.0"
description = "LeRobot teleoperator plugin for Niryo NED2 over ROS2."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Your Name" }]

dependencies = [
  "lerobot",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lerobot_teleoperator_ned2_ros2 = ["*.md"]
